{% extends "base.html" %}
{% block title %}마이페이지{% endblock %}
{% block content %}
<h2>👤 마이페이지</h2>
<div id="profile"></div>
<h3>주문내역</h3>
<div id="orders"></div>
{% endblock %}
{% block scripts %}
<script>
apiFetch("/auth/me").then(r => r.json()).then(u => {
    document.getElementById("profile").innerHTML = `<p>${u.email} (${u.nickname}) - ${u.role}</p>`;
});
apiFetch("/api/orders/").then(r => r.json()).then(data => {
    const box = document.getElementById("orders");
    (data.results || data).forEach(o => {
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `<span>주문 #${o.id} (${o.order_status})</span><span>${o.total_amount}원</span>`;
        box.appendChild(div);
    });
});
</script>
{% endblock %}
