{% extends "base.html" %}
{% block title %}장바구니{% endblock %}
{% block content %}
<h2>🛒 장바구니</h2>
<div id="cart-items"></div>
<h3 id="total"></h3>
<button onclick="checkout()">주문하기</button>
{% endblock %}
{% block scripts %}
<script>
apiFetch("/api/cart/").then(r => r.json()).then(cart => {
    const box = document.getElementById("cart-items");
    cart.items.forEach(item => {
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `<span>${item.bookTitle} x ${item.quantity}</span><span>${item.subtotal}원</span>`;
        box.appendChild(div);
    });
    document.getElementById("total").textContent = `총 결제금액: ${cart.totalAmount}원`;
    window._cartItemIds = cart.items.map(i => i.id);
});

async function checkout() {
    const res = await apiFetch("/api/orders/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cartItemIds: window._cartItemIds }),
    });
    const order = await res.json();
    const ready = await apiFetch("/api/orders/payments/kakao/ready", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderId: order.id }),
    });
    const readyData = await ready.json();
    if (readyData.redirectUrl) {
        window.location.href = readyData.redirectUrl;
    } else {
        alert(readyData.error || "결제 준비에 실패했습니다.");
    }
}
</script>
{% endblock %}
