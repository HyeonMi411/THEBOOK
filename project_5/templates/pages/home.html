{% extends "base.html" %}
{% block title %}BookStore - 도서 목록{% endblock %}
{% block content %}
<h2>📖 도서 목록</h2>
<div id="book-grid" class="book-grid"></div>
{% endblock %}
{% block scripts %}
<script>
apiFetch("/api/books/").then(r => r.json()).then(data => {
    const grid = document.getElementById("book-grid");
    (data.results || data).forEach(book => {
        const div = document.createElement("div");
        div.className = "book-card";
        div.innerHTML = `
            <img src="${book.cover || ''}" alt="${book.title}">
            <h4>${book.title}</h4>
            <div>${book.author}</div>
            <div class="price">${book.price}원</div>
            <button onclick="addToCart(${book.id})">장바구니 담기</button>
        `;
        grid.appendChild(div);
    });
});

function addToCart(bookId) {
    if (!getAccessToken()) { window.location.href = "/login"; return; }
    apiFetch("/api/cart/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ bookId, quantity: 1 }),
    }).then(r => r.json()).then(() => alert("장바구니에 담았습니다."));
}
</script>
{% endblock %}
