<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookStore{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        // project_3에서 localhost:8080 하드코딩으로 여러 번 문제를 겪었던 것을 반영해,
        // API_BASE는 반드시 현재 접속 도메인을 그대로 사용 (Django가 같은 서버에서 API도 같이 서빙하므로
        // 별도 프론트엔드 배포/CORS 설정 자체가 필요 없음)
        const API_BASE = window.location.origin;
    </script>
</head>
<body>
    <header class="nav">
        <a href="/" class="logo">📚 BookStore</a>
        <nav>
            <a href="/">도서</a>
            <a href="/cart">장바구니</a>
            <a href="/mypage">마이페이지</a>
            <a href="/login" id="nav-login">로그인</a>
            <a href="/signup" id="nav-signup">회원가입</a>
            <a href="#" id="nav-logout" style="display:none;">로그아웃</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/common.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
