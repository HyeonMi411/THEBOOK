spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            scope: account_email, profile_nickname, profile_image
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            client-authentication-method: none    

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope: email,nickname,profile_image
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          # google : 원래는 issuer-uri 하나로 OIDC discovery 를 이용해 authorization/token/
          #   userinfo/jwks 엔드포인트를 전부 자동으로 찾아냈는데, 이렇게 하면 authorization
          #   요청 URL에 우리가 원하는 쿼리파라미터(prompt=select_account)를 끼워넣을 방법이
          #   없음. 그래서 구글의 표준 엔드포인트를 전부 명시적으로 풀어써서, authorization-uri
          #   에만 prompt=select_account 를 추가. (UserInfoGoogle.java 가 참조하는
          #   sub/email/name/picture 는 표준 OIDC 클레임이라 그대로 호환)
          #   prompt=select_account : 이미 구글에 로그인되어 있어도 매번 "계정 선택" 화면을
          #   보여주도록 강제. 완전한 "구글 계정 로그아웃"은 Gmail 등 다른 구글 서비스의
          #   로그인 세션까지 함께 끊어버려서 권장되지 않으므로, 그 대신 "다음 로그인 시 항상
          #   재확인시키는" 이 방법으로 "로그아웃해도 바로 재로그인되는" 문제를 해결.
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
          # kakao : prompt=login 을 추가하면, 브라우저에 카카오 로그인 세션이 남아있어도
          #   비밀번호 확인 없이 자동으로 재로그인되지 않고, 매번 카카오 로그인 화면을 다시
          #   보여줍니다. (카카오 공식 문서: "login - 기존 사용자 인증 여부와 상관없이
          #   사용자에게 카카오계정 로그인 화면을 출력하여 다시 사용자 인증을 수행")
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize?prompt=login
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: kakao_account
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  oauth2:
    # 모바일 앱 소셜 로그인: 브라우저 로그인 → 이 서버의 /oauth2/app/callback → 앱(bookstore4://)으로 복귀
    #   배포 시 OAUTH2_REDIRECT_URL = https://<project_4 도메인>/oauth2/app/callback  (project_3 도메인과 달라야 함)
    redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:8082/oauth2/app/callback}
    # 신규 소셜회원 가입확인 - 앱의 "닉네임 확인 + 이메일 인증" 화면으로 넘겨주는 중계 주소
    signup-confirm-url: ${OAUTH2_SIGNUP_CONFIRM_URL:http://localhost:8082/oauth2/app/signup}
    # 로그인 결과를 앱으로 돌려줄 딥링크 스킴 (AndroidManifest / Info.plist 의 스킴과 같아야 함)
    app-scheme: ${APP_DEEPLINK_SCHEME:bookstore4}
  # 카카오페이 결제완료/취소/실패 후 리다이렉트될 URL(=이 주소 + /payment/complete 등)을 만드는 데 사용.
  # project_4(모바일 앱)는 별도 웹 프론트가 없으므로, GitHub Secrets 의 FRONTEND_BASE_URL_P4 를
  # project_4 백엔드의 외부 주소(예: https://bookproject4.duckdns.org)로 지정하세요.
  # → PaymentCallbackController(/payment/**)가 결제 승인을 처리하고 "앱으로 돌아가세요" 안내 페이지를 보여줍니다.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

 
# 카카오 도서검색 API(dapi.kakao.com) 용 REST API 키
#   카카오 개발자센터의 REST API 키 하나로 로그인/도서검색 둘 다 사용 가능.
#   KAKAO_REST_API_KEY 를 별도로 안 정해주셨다면, 위에서 쓰고 계신 KAKAO_CLIENT_ID 를 그대로 재사용.
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:${KAKAO_CLIENT_ID:}}
  # 카카오페이 결제 API 설정
  #   2024.01.03 자로 카카오페이 API 인증방식이 전면 개편되어, 기존 Admin Key 는 더 이상
  #   사용 불가. 반드시 카카오페이 "전용" 개발자센터(developers.kakaopay.com,
  #   일반 카카오 디벨로퍼스(developers.kakao.com)와는 별개의 사이트)에 별도
  #   가입/애플리케이션 등록 후, [기본정보 > 발급정보]에서 Secret Key(dev) 를 발급받아
  #   .env 의 KAKAO_PAY_SECRET_KEY 에 넣을 것. (알파벳 대문자+숫자 40자)
  pay:
    secret-key: ${KAKAO_PAY_SECRET_KEY:}
    cid: ${KAKAO_PAY_CID:TC0ONETIME}

# 국립중앙도서관 도서검색 API 키 - 키를 코드에 두면 GitHub 에 그대로 공개되므로 .env 의 NL_API_KEY 로만 받습니다.
nl:
  api:
    key: ${NL_API_KEY:}
