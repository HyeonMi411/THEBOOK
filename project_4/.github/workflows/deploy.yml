name: Deploy project_4 (Spring Boot Post API)

on:
  push:
    branches:
      - main
    paths:
      - 'project_4/back/**'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: project_4/back

      - name: Build Spring Boot App
        run: ./gradlew clean build -x test
        working-directory: project_4/back

      - name: Find JAR file
        run: echo "JAR_FILE=$(ls project_4/back/build/libs/*SNAPSHOT.jar | grep -v plain | head -n 1)" >> $GITHUB_ENV

      # project_3에서 여러 번 재발했던 실수를 반영해, .env에 필요한 시크릿 전부를 처음부터 포함.
      - name: Create Backend .env from Secrets
        run: |
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> project_4/back/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> project_4/back/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> project_4/back/.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> project_4/back/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> project_4/back/.env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> project_4/back/.env
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> project_4/back/.env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> project_4/back/.env
          echo "GMAIL_USERNAME=${{ secrets.GMAIL_USERNAME }}" >> project_4/back/.env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> project_4/back/.env
          echo "KAKAO_PAY_SECRET_KEY=${{ secrets.KAKAO_PAY_SECRET_KEY }}" >> project_4/back/.env
          echo "NL_API_KEY=${{ secrets.NL_API_KEY }}" >> project_4/back/.env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> project_4/back/.env
          echo "FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL_P4 }}" >> project_4/back/.env

      - name: Ensure app directory exists on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app/project_4

      - name: Copy Backend JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "project_4/back/build/libs/back-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app"

      - name: Copy Backend .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "project_4/back/.env"
          target: "/home/ubuntu/app"

      # project_3(8080)과 포트 충돌을 피하기 위해 project_4는 8082로 분리
      - name: Run Backend on EC2 with pm2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/project_4/back/build/libs
            pm2 delete project4-backend || true
            export $(cat /home/ubuntu/app/project_4/back/.env | xargs)
            pm2 start java --name project4-backend -- -Dserver.port=8082 -jar back-0.0.1-SNAPSHOT.jar
            pm2 save

  build-mobile-apk:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: project_4/mobile

      - name: Build APK
        run: flutter build apk --release
        working-directory: project_4/mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project4-app-release
          path: project_4/mobile/build/app/outputs/flutter-apk/app-release.apk
