name: Deploy project_4 (Spring Boot Post API + Django Dashboard)

on:
  push:
    branches:
      - main
    paths:
      - 'project_4/back/**'
      - 'project_4/dashboard/**'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: project_4/back

      - name: Build Spring Boot App
        run: ./gradlew clean build -x test
        working-directory: project_4/back

      - name: Find JAR file
        run: echo "JAR_FILE=$(ls project_4/back/build/libs/*SNAPSHOT.jar | grep -v plain | head -n 1)" >> $GITHUB_ENV

      # project_3에서 여러 번 재발했던 실수를 반영해, .env에 필요한 시크릿 전부를 처음부터 포함.
      - name: Create Backend .env from Secrets
        run: |
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> project_4/back/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> project_4/back/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> project_4/back/.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> project_4/back/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> project_4/back/.env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> project_4/back/.env
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> project_4/back/.env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> project_4/back/.env
          echo "GMAIL_USERNAME=${{ secrets.GMAIL_USERNAME }}" >> project_4/back/.env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> project_4/back/.env
          echo "KAKAO_PAY_SECRET_KEY=${{ secrets.KAKAO_PAY_SECRET_KEY }}" >> project_4/back/.env
          echo "NL_API_KEY=${{ secrets.NL_API_KEY }}" >> project_4/back/.env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> project_4/back/.env
          echo "FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL_P4 }}" >> project_4/back/.env

      - name: Ensure app directory exists on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app/project_4

      - name: Copy Backend JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "project_4/back/build/libs/back-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app"

      - name: Copy Backend .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "project_4/back/.env"
          target: "/home/ubuntu/app"

      # project_3(8080)과 포트 충돌을 피하기 위해 project_4는 8082로 분리
      - name: Run Backend on EC2 with pm2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/project_4/back/build/libs
            pm2 delete project4-backend || true
            export $(cat /home/ubuntu/app/project_4/back/.env | xargs)
            pm2 start java --name project4-backend -- -Dserver.port=8082 -jar back-0.0.1-SNAPSHOT.jar
            pm2 save

  build-mobile-apk:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: project_4/mobile

      - name: Build APK
        run: flutter build apk --release
        working-directory: project_4/mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project4-app-release
          path: project_4/mobile/build/app/outputs/flutter-apk/app-release.apk

  dashboard:
    runs-on: ubuntu-latest
    needs: backend   # Spring Boot(같은 Oracle DB의 주인)가 먼저 배포되어 있어야 함
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: project_4/dashboard

      - name: Django check (배포 전 코드 자체 검증)
        run: python manage.py check
        working-directory: project_4/dashboard

      # Spring Boot(project_4/back)와 완전히 같은 Oracle 접속정보를 그대로 재사용
      # (읽기 전용으로만 쓰는 계정이라 같은 시크릿을 공유해도 안전)
      - name: Create .env from Secrets
        run: |
          echo "DJANGO_SECRET_KEY=${{ secrets.DASHBOARD_SECRET_KEY }}" >> project_4/dashboard/.env
          echo "DJANGO_DEBUG=False" >> project_4/dashboard/.env
          echo "DJANGO_ALLOWED_HOSTS=${{ secrets.DASHBOARD_ALLOWED_HOSTS }}" >> project_4/dashboard/.env
          echo "ORACLE_DSN=${{ secrets.ORACLE_DSN }}" >> project_4/dashboard/.env
          echo "ORACLE_USER=${{ secrets.DB_USERNAME }}" >> project_4/dashboard/.env
          echo "ORACLE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> project_4/dashboard/.env

      - name: Ensure app directory exists on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app/project_4/dashboard

      - name: Copy dashboard code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "project_4/dashboard/*,project_4/dashboard/.env"
          target: "/home/ubuntu/app"

      # project_3(8080), project_4 백엔드(8082)와 겹치지 않게 대시보드는 8083 포트로 분리.
      # Django 자체 관리자 계정(auth_user)용 로컬 sqlite만 migrate하고,
      # analytics(Oracle 매핑) 쪽은 DB 라우터가 마이그레이션을 막아주므로 그대로 둠.
      - name: Install deps & migrate(local sqlite only) on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/project_4/dashboard
            python3 -m venv .venv || true
            source .venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --database=default --noinput

      - name: Restart with pm2 (gunicorn)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/project_4/dashboard
            source .venv/bin/activate
            pip install gunicorn
            pm2 delete project4-dashboard || true
            pm2 start ".venv/bin/gunicorn" --name project4-dashboard -- config.wsgi:application --bind 0.0.0.0:8083
            pm2 save
