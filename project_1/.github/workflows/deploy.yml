name: Deploy project_5 (Django)   # project_3의 CI/CD 경험을 반영해 작성

on:
  push:
    branches:
      - main
    paths:
      - 'project_5/**'
  workflow_dispatch:   # project_3에서 필요했던 수동 실행 버튼도 처음부터 포함

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: project_5

      - name: Django check (배포 전 코드 자체 검증)
        run: python manage.py check
        working-directory: project_5

      # project_3에서 Gmail/카카오페이/OpenAI 시크릿을 .env 생성 스텝에서 누락해
      # 여러 번 재발했던 문제를 반영해, 필요한 시크릿 전부를 처음부터 포함.
      - name: Create .env from Secrets
        run: |
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> project_5/.env
          echo "DJANGO_DEBUG=False" >> project_5/.env
          echo "DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}" >> project_5/.env
          echo "FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL_P5 }}" >> project_5/.env
          echo "CORS_ALLOWED_ORIGINS=${{ secrets.FRONTEND_BASE_URL_P5 }}" >> project_5/.env
          echo "DB_ENGINE=${{ secrets.DB_ENGINE_P5 }}" >> project_5/.env
          echo "DB_NAME=${{ secrets.DB_NAME_P5 }}" >> project_5/.env
          echo "DB_USER=${{ secrets.DB_USER_P5 }}" >> project_5/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD_P5 }}" >> project_5/.env
          echo "DB_HOST=${{ secrets.DB_HOST_P5 }}" >> project_5/.env
          echo "GMAIL_USERNAME=${{ secrets.GMAIL_USERNAME }}" >> project_5/.env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> project_5/.env
          echo "KAKAO_PAY_SECRET_KEY=${{ secrets.KAKAO_PAY_SECRET_KEY }}" >> project_5/.env
          echo "KAKAO_PAY_CID=${{ secrets.KAKAO_PAY_CID }}" >> project_5/.env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> project_5/.env
          echo "NL_API_KEY=${{ secrets.NL_API_KEY }}" >> project_5/.env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> project_5/.env

      - name: Copy project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "project_5/*,project_5/.env"
          target: "/home/ubuntu/app"

      - name: Install deps & migrate on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/project_5
            python3 -m venv .venv || true
            source .venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

      - name: Restart with pm2 (gunicorn)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/project_5
            source .venv/bin/activate
            pip install gunicorn
            pm2 delete django-backend || true
            pm2 start ".venv/bin/gunicorn" --name django-backend -- config.wsgi:application --bind 0.0.0.0:8001
            pm2 save
