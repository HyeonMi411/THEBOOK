spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            scope: account_email, profile_nickname, profile_image
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            client-authentication-method: none    

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope: email,nickname,profile_image
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          google:
            issuer-uri: https://accounts.google.com
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: kakao_account
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  oauth2:
    redirect-url: http://localhost:3000/oauth2/callback
  # ★프론트엔드(React) 기본 주소 - 카카오페이 결제완료/취소/실패 후 리다이렉트될 URL을 만드는 데 사용합니다.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

 
# ★카카오 도서검색 API(dapi.kakao.com) 용 REST API 키
#   카카오 개발자센터의 REST API 키 하나로 로그인/도서검색 둘 다 사용 가능합니다.
#   KAKAO_REST_API_KEY 를 별도로 안 정해주셨다면, 위에서 쓰고 계신 KAKAO_CLIENT_ID 를 그대로 재사용합니다.
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:${KAKAO_CLIENT_ID:}}
  # ★카카오페이 결제 API 설정
  #   2024.01.03 자로 카카오페이 API 인증방식이 전면 개편되어, 기존 Admin Key 는 더 이상
  #   사용할 수 없습니다. 반드시 카카오페이 "전용" 개발자센터(developers.kakaopay.com,
  #   일반 카카오 디벨로퍼스(developers.kakao.com)와는 별개의 사이트입니다)에 별도
  #   가입/애플리케이션 등록 후, [기본정보 > 발급정보]에서 Secret Key(dev) 를 발급받아
  #   .env 의 KAKAO_PAY_SECRET_KEY 에 넣어주세요. (알파벳 대문자+숫자 40자)
  pay:
    secret-key: ${KAKAO_PAY_SECRET_KEY:}
    cid: ${KAKAO_PAY_CID:TC0ONETIME}

# ★국립중앙도서관 도서검색 API 키 (boot1 원본에서 사용하던 키를 기본값으로 둡니다.
#   개인/테스트용 키일 수 있으니, 정상 동작 안 하면 국립중앙도서관 오픈API 홈페이지에서
#   본인 명의로 새로 발급받아 .env 의 NL_API_KEY 값을 교체해주세요.)
nl:
  api:
    key: ${NL_API_KEY:2e9fc657c6c68b702f22af6878d76b9280e0edd7fe220af5db9184a67ac3e36b}
